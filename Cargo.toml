[package]
name = "rust-natsd"
version = "0.1.0"
edition = "2021"
description = "A NATS server (Core NATS pub-sub protocol) implemented in Rust"
license = "Apache-2.0"

[lib]
name = "rust_natsd"
path = "src/lib.rs"

[[bin]]
name = "rust-natsd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
async-nats = "0.38"
futures = "0.3"

[profile.release]
opt-level = 3
